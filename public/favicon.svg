<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Card 1: Ace of Spades (tilted left) -->
  <g transform="rotate(-12 32 32)">
    <rect x="12" y="8" width="40" height="52" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <path d="M 32 22 C 20 34, 20 44, 28 44 C 30 44, 31 43, 31.5 41 L 34 50 L 30 50 L 32.5 41 C 33 43, 34 44, 36 44 C 44 44, 44 34, 32 22 Z" fill="#1f2937"/>
  </g>
  
  <!-- Card 2: Ace of Hearts (foreground, straight) -->
  <g transform="rotate(8 32 32)">
    <rect x="12" y="8" width="40" height="52" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <!-- Big Heart -->
    <path d="M 32 28 C 22 18, 12 32, 32 48 C 52 32, 42 18, 32 28 Z" fill="#ef4444"/>
    <!-- Top Left 'A' and Heart -->
    <text x="16" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#ef4444">A</text>
    <path d="M 18 20 C 15 17, 12 21, 18 26 C 24 21, 21 17, 18 20 Z" fill="#ef4444"/>
    <!-- Bottom Right 'A' and Heart -->
    <g transform="translate(48, 52) rotate(180)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#ef4444">A</text>
      <path d="M 2 2 C -1 -1, -4 3, 2 8 C 8 3, 5 -1, 2 2 Z" fill="#ef4444"/>
    </g>
  </g>
</svg>