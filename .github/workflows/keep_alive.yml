name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Every 14 minutes (Render timeout is 15 mins)
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Server
        run: |
          curl -s https://cardio-5uu3.onrender.com/ping
          echo "Pinged server at $(date)"
